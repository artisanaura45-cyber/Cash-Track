<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#cdeee0">
<title>Cash Track</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cash Track">
<style>
:root{--bg:#f3f7f5;--card:#ffffff;--card2:#eaf1ee;--line:#d3dfd9;--tx:#14221f;--mut:#5b6e68;--acc:#0f8f6b;--acc2:#d7f1e6;--bad:#d64545;--inv:#7c5cf0;--emg:#f0a30a;--per:#e8466a;--hh:#1e9be0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
header h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:.2px}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 16px 24px}
nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:58px;background:none;border:0;color:var(--mut);font:inherit;font-size:.72rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button span{font-size:1.25rem;line-height:1}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid .card{margin:0}
.lbl{color:var(--mut);font-size:.78rem}.big{font-size:1.25rem;font-weight:700;margin-top:4px;word-break:break-word}
.pos{color:var(--acc)}.neg{color:var(--bad)}
h2{font-size:1rem;margin:16px 0 10px}
input,select,button{font:inherit}
input,select{width:100%;min-height:46px;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin:4px 0 10px}
input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
label{font-size:.8rem;color:var(--mut)}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-weight:600}
.btn.p{background:var(--acc);color:#04170e;border-color:var(--acc)}
.btn.d{color:var(--bad);border-color:#5a2a2a}
.btn:disabled{opacity:.45}
.btn.w{width:100%;margin-top:8px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px}
.bk{display:flex;justify-content:space-between;font-size:.9rem;gap:8px}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}.tx .m{flex:1;min-width:0}.tx .m b{display:block;font-size:.92rem}
.tx .m small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.ib{min-width:40px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--tx);flex:none}
.fab{position:absolute;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--acc);color:#04170e;border:0;font-size:2rem;box-shadow:0 6px 18px #0008;z-index:5}
.empty{text-align:center;color:var(--mut);padding:26px 8px}
.user{width:100%;text-align:left;display:flex;align-items:center;gap:12px;min-height:60px;margin-bottom:8px}
.av{width:38px;height:38px;border-radius:50%;background:var(--acc2);color:var(--acc);display:grid;place-items:center;font-weight:700;flex:none}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;background:var(--card);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet h3{margin:0;padding:16px 16px 6px}
.sb{padding:6px 16px;overflow-y:auto;overscroll-behavior:contain}
.sf{display:flex;gap:8px;padding:10px 16px 16px}.sf .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000d;color:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:24px;font-size:.88rem;z-index:60;display:none;max-width:90%;text-align:center}
.chip{font-size:.7rem;padding:2px 8px;border-radius:10px;background:var(--card2);color:var(--mut)}
@media(min-width:600px){#modal{align-items:center}.sheet{border-radius:20px}}
body{font-variant-numeric:tabular-nums}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}.mnav b{font-size:1.02rem}
.donut{position:relative;width:min(76vw,290px);margin:4px auto 14px}.donut svg{width:100%;display:block}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 21%}.dc .big{font-size:1.3rem;margin:2px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;color:var(--tx);min-height:120px;display:block;width:100%;font:inherit}
.tile:active{transform:scale(.98);background:var(--card2)}
.tile .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;margin-bottom:8px}
.tile .v{font-weight:700;margin-top:2px;word-break:break-word}
.amt{font-size:1.8rem;font-weight:700;min-height:60px}
.brand{text-align:center;padding:26px 0 14px}.brand h1{margin:10px 0 2px;font-size:2rem;font-weight:800;letter-spacing:.3px}
:root{--tone:#cdeee0;--ink:#12403a}
#app{padding-top:0;background:var(--bg)}
header{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;background:var(--tone);border-radius:0 0 22px 22px;position:relative}
.dhead{display:flex;align-items:center;justify-content:center;gap:9px}
.dhead b{font-size:1.15rem;color:var(--ink)}
.chip-abs{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top,0px));bottom:14px;display:flex;align-items:center}
header h1{background:var(--ink);color:#fff;padding:7px 14px;border-radius:10px;font-size:1.05rem}
main{padding-top:14px}
h2{display:inline-block;background:var(--ink);color:#fff;padding:6px 12px;border-radius:8px;font-size:.88rem;margin:14px 0 10px}
.card>b:first-child{display:inline-block;background:var(--tone);color:var(--ink);padding:5px 11px;border-radius:8px;margin-bottom:4px}
.card,.tile{box-shadow:0 1px 3px #12403a14}
.btn.p,.fab{background:#0f8f6b;border-color:#0f8f6b;color:#fff}
.btn.d{border-color:#f0c4c4;background:#fff}
.pos{color:#0b8a65}.neg{color:var(--bad)}
.brand{background:var(--tone);margin:-14px -16px 16px;padding:calc(26px + env(safe-area-inset-top,0px)) 16px 22px;border-radius:0 0 26px 26px}
nav{box-shadow:0 -1px 6px #12403a12}
nav button.on{color:#0b8a65;font-weight:700}
.av{background:var(--tone);color:var(--ink)}
.chip{background:#fff;color:var(--ink)}
#modal{background:#12403a99}
.mnav b{background:#fff;padding:6px 14px;border-radius:20px;border:1px solid var(--line)}
.foot{text-align:center;padding:22px 0 10px}
.foot span{display:inline-block;background:var(--tone);color:var(--ink);font-size:.72rem;font-weight:700;padding:6px 16px;border-radius:20px}
.brand svg{border-radius:50%;box-shadow:0 6px 16px #0b0b0b40}

.loginwrap{position:relative;margin:-14px -16px -24px;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));background:var(--tone);min-height:calc(100vh + 24px);overflow:hidden}
.loginwrap::after{content:'';position:absolute;left:0;right:0;bottom:0;height:58%;background-image:var(--login-bg);background-size:cover;background-position:center bottom;opacity:.16;pointer-events:none}
.loginwrap>*{position:relative;z-index:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
#main{animation:fadeUp .22s ease}
.sheet{animation:slideUp .28s cubic-bezier(.16,1,.3,1)}
.tile,.btn,.fab{transition:transform .15s ease}
.btn:active,.fab:active{transform:scale(.96)}
nav button{transition:color .15s ease,transform .15s ease}
nav button:active{transform:scale(.92)}
.donut{animation:fadeUp .3s ease}
.tx{animation:fadeUp .2s ease}
</style>
</head>

let S={users:[],cur:null,key:null,d:null,view:'dash',month:mk(new Date()),f:{m:mk(new Date()),b:'',q:'',s:'dd'},hid:0,recOpen:{}};
const LS={get(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Could not write to device storage');return false}}};
const fmt=n=>{n=Number.isFinite(n)?n:0;const cur=(S.d&&S.d.cur)||'Rs';return(n<0?'-':'')+cur+' '+Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:2})};

/* ---------- crypto ---------- */
const te=new TextEncoder(),td=new TextDecoder(),ITER=250000;
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(p,salt,it){const m=await crypto.subtle.importKey('raw',te.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(k,o){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(JSON.stringify(o)));return{iv:b64(iv),ct:b64(new Uint8Array(ct))}}
async function unseal(k,r){return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(r.iv)},k,unb64(r.ct))))}
let sq=Promise.resolve();
const save=()=>sq=sq.then(async()=>{if(!S.cur||!S.key)return;try{LS.set('pcft_v_'+S.cur.id,await seal(S.key,S.d))}catch(e){toast('Encryption failed')}});
function norm(d){d=d||{};const al={};let sum=0;for(const k in B){al[k]=Math.max(0,num(d.al&&d.al[k]));sum+=al[k]}
 if(Math.abs(sum-100)>0.001)Object.assign(al,DEF_AL);
 return{cur:String(d.cur||'Rs').slice(0,6),gross:Math.max(0,num(d.gross)),take:Math.max(0,num(d.take)),al,
 tx:(Array.isArray(d.tx)?d.tx:[]).map(t=>{const b=B[t&&t.b]?t.b:'hh';return{id:String(t&&t.id||uid()),d:/^\d{4}-\d{2}-\d{2}$/.test(t&&t.d)?t.d:today(),b,c:String(t&&t.c||'Other').slice(0,40),a:Math.max(0,num(t&&t.a)),n:String(t&&t.n||'').slice(0,200),k:(B[b].s&&t&&t.k==='out')?'out':'add'}}),
 income:(Array.isArray(d.income)?d.income:[]).map(x=>({id:String(x&&x.id||uid()),d:/^\d{4}-\d{2}-\d{2}$/.test(x&&x.d)?x.d:today(),c:String(x&&x.c||'Other Income').slice(0,40),a:Math.max(0,num(x&&x.a)),n:String(x&&x.n||'').slice(0,200)}))}}
async function createAccount(name,pwd,data){const salt=crypto.getRandomValues(new Uint8Array(16));const key=await derive(pwd,salt,ITER);
 const u={id:uid(),name,salt:b64(salt),it:ITER};S.users.push(u);LS.set('pcft_users',S.users);S.cur=u;S.key=key;S.d=norm(data);S.view='dash';await save()}
const nameTaken=n=>S.users.some(u=>u.name.toLowerCase()===n.toLowerCase());

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2800)}
function closeM(){$('#modal').classList.remove('on');$('#modal').innerHTML=''}
function openForm(title,body,okLabel,onOk,danger){
 $('#modal').innerHTML=`<div class="sheet"><h3>${esc(title)}</h3><div class="sb">${body}</div><div class="sf"><button class="btn" id="mc">Cancel</button><button class="btn ${danger?'d':'p'}" id="mok">${esc(okLabel)}</button></div></div>`;
 $('#modal').classList.add('on');let busy=false;
 $('#mc').onclick=closeM;
 $('#mok').onclick=async()=>{if(busy)return;busy=true;const b=$('#mok');b.disabled=true;let r;try{r=await onOk()}catch(e){toast('Something went wrong');r=false}busy=false;if(r===false){if($('#mok'))$('#mok').disabled=false}else closeM()};
 const f=$('#modal input');if(f&&!f.type.match(/date|month/))setTimeout(()=>f.focus(),50)}
const confirmM=(title,msg,ok)=>new Promise(res=>{openForm(title,`<p style="color:var(--mut)">${esc(msg)}</p>`,ok,()=>{res(true)},true);$('#mc').onclick=()=>{closeM();res(false)}});
const opts=(arr,sel)=>arr.map(([v,l])=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`).join('');
const monthLabel=m=>{const[y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})};

/* ---------- calculations ---------- */
function agg(m){const r={inv:0,emg:0,per:0,hh:0,tot:0};for(const t of S.d.tx)if(m==='all'||t.d.startsWith(m)){const v=t.k==='out'?-t.a:t.a;r[t.b]+=v;r.tot+=v}return r}
function passive(m){return(S.d.income||[]).filter(x=>m==='all'||x.d.startsWith(m)).reduce((s,x)=>s+x.a,0)}
const budget=k=>S.d.take*S.d.al[k]/100;
const savingsAll=()=>{const r=agg('all');return r.inv+r.emg};
const savingsAllOne=k=>agg('all')[k];
const months=()=>[...new Set([...S.d.tx.map(t=>t.d.slice(0,7)),...(S.d.income||[]).map(x=>x.d.slice(0,7)),S.month])].sort().reverse();

/* ---------- views ---------- */
function loginView(){
 if(!(window.crypto&&crypto.subtle))return`<main><div class="card"><h2>Secure storage unavailable</h2><p class="lbl">This WebView does not expose the Web Crypto API. Serve the page from a secure origin (for example WebViewAssetLoader on https://appassets.androidplatform.net).</p></div>${FOOT}</main>`;
 return`<main><div class="loginwrap" style="--login-bg:url('${LOGIN_BG}')"><div class="brand">${LOGO}<h1>Cash Track</h1><div class="lbl">Private. Encrypted. Offline.</div><div class="lbl" style="margin-top:6px;font-weight:600;color:var(--ink)">Welcome to Cash Track – Your personal financial tracker.</div></div>
 <h2 style="margin-top:4px">Your accounts</h2><p class="lbl" style="margin:0 2px 12px">Everything stays on this device, encrypted with your master password.</p>
 ${S.users.map(u=>`<button class="btn user" data-a="login" data-id="${esc(u.id)}"><span class="av">${esc(u.name.charAt(0).toUpperCase())}</span><span>${esc(u.name)}</span></button>`).join('')||'<div class="empty">No accounts yet. Create the first one.</div>'}
 <button class="btn p w" data-a="newacct">Create account</button>
 <button class="btn w" data-a="restore">Restore from backup file</button>${FOOT}</div></main>`}
function dashView(){const a=agg(S.month),d=S.d,pin=passive(S.month),tinc=d.take+pin,bal=tinc-a.tot;
 const setup=d.take<=0?`<div class="card"><b>Set up your salary</b><p class="lbl">Add your take-home salary and allocation split to see budgets.</p><button class="btn p" data-a="nav" data-v="inc">Income</button></div>`:'';
 const R=80,C=2*Math.PI*R;
 const dvals=Object.keys(B).map(k=>Math.max(0,a[k]));const dtot=dvals.reduce((s,v)=>s+v,0);let off=0;
 const segs=dtot>0?Object.keys(B).map((k,i)=>{const l=dvals[i]/dtot*C;const o=`<circle cx="100" cy="100" r="${R}" fill="none" stroke-width="26" style="stroke:${B[k].c}" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=l;return o}).join(''):'';
 const recent=[...d.tx.filter(t=>t.d.startsWith(S.month)).map(t=>({...t,_t:'tx'})),...(d.income||[]).filter(x=>x.d.startsWith(S.month)).map(x=>({...x,_t:'inc'}))].sort((x,y)=>y.d.localeCompare(x.d)).slice(0,5);
 return`<div class="lbl" style="margin-bottom:10px">Welcome to Cash Track – Your personal financial tracker.</div>
 <div class="mnav"><button class="ib" data-a="mshift" data-n="-1" aria-label="Previous month">‹</button><b>${monthLabel(S.month)}</b><button class="ib" data-a="mshift" data-n="1" aria-label="Next month"${S.month>=monthRange().cm?' style="opacity:.35"':''}>›</button></div>${setup}
 <div class="donut"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="${R}" fill="none" stroke-width="26" style="stroke:var(--card2)"/>${segs}</svg><div class="dc"><div class="lbl">Available balance</div><div class="big ${bal<0?'neg':'pos'}">${fmt(bal)}</div><div class="lbl">Net outflow ${fmt(a.tot)}</div></div></div>
 <div class="grid"><div class="card"><div class="lbl">Income this month</div><div class="big">${fmt(tinc)}</div>${pin>0?`<div class="lbl">Salary ${fmt(d.take)} + Passive ${fmt(pin)}</div>`:''}</div><div class="card"><div class="lbl">All-time savings</div><div class="big pos">${fmt(savingsAll())}</div></div></div>
 <h2>Tap a bucket to add</h2><div class="tiles">${Object.keys(B).map(k=>{const bg=budget(k),sp=a[k],p=bg>0?Math.max(0,Math.min(100,sp/bg*100)):(sp>0?100:0),over=sp>bg+0.005;
 return`<button class="tile" data-a="addtx" data-b="${k}"><div class="ic" style="background:${B[k].c}">${IC[k]}</div><div class="lbl">${B[k].n} · ${d.al[k]}%</div><div class="v ${sp<0?'pos':(over?'neg':'')}">${fmt(sp)}</div><div class="lbl">of ${fmt(bg)}</div><div class="bar"><i style="width:${p}%;background:${over?'var(--bad)':B[k].c}"></i></div></button>`}).join('')}</div>
 <h2>Recent</h2><div class="card">${recent.length?recent.map(x=>x._t==='inc'?incRow(x):txRow(x)).join(''):'<div class="empty">No activity this month.</div>'}</div>`}
function txRow(t){const out=t.k==='out';const amt=fmt(out?-t.a:t.a);const cls=out?'neg':(B[t.b].s?'pos':'');return`<div class="tx"><span class="dot" style="background:${B[t.b].c}"></span><div class="m"><b>${esc(t.c)}${out?' · Withdrawal':''}</b><small>${esc(t.d)} · ${B[t.b].n}${t.n?' · '+esc(t.n):''}</small></div><b class="${cls}">${amt}</b><button class="ib" data-a="edittx" data-id="${esc(t.id)}" aria-label="Edit">✎</button></div>`}
function incRow(x){return`<div class="tx"><span class="dot" style="background:var(--acc)"></span><div class="m"><b>${esc(x.c)}</b><small>${esc(x.d)} · Passive income${x.n?' · '+esc(x.n):''}</small></div><b class="pos">${fmt(x.a)}</b><button class="ib" data-a="editinc" data-id="${esc(x.id)}" aria-label="Edit">✎</button></div>`}
function txView(){const f=S.f;const ms=[['all','All months'],...months().map(m=>[m,monthLabel(m)])];
 if(f.m!=='all'&&!months().includes(f.m))f.m='all';
 return`<div class="row"><div><label>Month</label><select data-f="m">${opts(ms,f.m)}</select></div><div><label>Bucket</label><select data-f="b">${opts([['','All buckets'],...Object.keys(B).map(k=>[k,B[k].n])],f.b)}</select></div></div>
 <div class="row"><div><label>Search</label><input data-f="q" placeholder="Category or note" value="${esc(f.q)}"></div><div><label>Sort</label><select data-f="s">${opts([['dd','Newest first'],['da','Oldest first'],['ad','Highest amount'],['aa','Lowest amount']],f.s)}</select></div></div>
 <div class="card" id="txlist"></div><button class="fab" data-a="addtx" aria-label="Add transaction">+</button>`}
function fillList(){const el=$('#txlist');if(!el)return;const f=S.f,q=f.q.trim().toLowerCase();
 let l=S.d.tx.filter(t=>(f.m==='all'||t.d.startsWith(f.m))&&(!f.b||t.b===f.b)&&(!q||(t.c+' '+t.n).toLowerCase().includes(q)));
 const cmp={dd:(x,y)=>y.d.localeCompare(x.d),da:(x,y)=>x.d.localeCompare(y.d),ad:(x,y)=>y.a-x.a,aa:(x,y)=>x.a-y.a}[f.s];l.sort(cmp);
 const tot=l.reduce((s,t)=>s+(t.k==='out'?-t.a:t.a),0);
 el.innerHTML=l.length?`<div class="lbl" style="margin-bottom:4px">${l.length} transaction${l.length>1?'s':''} · ${fmt(tot)}</div>`+l.map(txRow).join(''):'<div class="empty">No matching transactions.<br>Tap + to add one.</div>'}
function daySpend(dateStr){let v=0;for(const t of S.d.tx){if(t.d!==dateStr)continue;if(t.b==='per'||t.b==='hh')v+=t.a;else if(B[t.b].s&&t.k==='out')v+=t.a}return v}
function weeksOfMonth(m){const p=m.split('-').map(Number),y=p[0],mo=p[1],dim=new Date(y,mo,0).getDate();
 const cells=[];for(let day=1;day<=dim;day++){const dt=new Date(y,mo-1,day);cells.push({day,dow:dt.getDay(),date:m+'-'+String(day).padStart(2,'0')})}
 const weeks=[];let week=new Array(7).fill(null);
 cells.forEach(c=>{week[c.dow]=c;if(c.dow===6){weeks.push(week);week=new Array(7).fill(null)}});
 if(week.some(x=>x))weeks.push(week);
 return weeks}
function dailyBreakdown(m){const weeks=weeksOfMonth(m);const cells=weeks.flat().filter(Boolean);
 const amts=cells.map(c=>daySpend(c.date));const max=Math.max(1,...amts);
 const dowLbl=['S','M','T','W','T','F','S'];
 let best=null;cells.forEach(c=>{const amt=daySpend(c.date);if(amt>0&&(!best||amt>best.amt))best={day:c.day,amt}});
 return`<div class="card" style="margin-top:8px">
 <div class="lbl" style="display:flex;margin-bottom:8px">${dowLbl.map(l=>`<span style="flex:1;text-align:center">${l}</span>`).join('')}</div>
 ${weeks.map(week=>`<div style="display:flex;align-items:flex-end;gap:4px;height:66px;margin-bottom:6px">${week.map(c=>{
  if(!c)return'<div style="flex:1"></div>';
  const amt=daySpend(c.date),h=amt>0?Math.max(6,Math.round(amt/max*52)):2,top=best&&c.day===best.day&&amt===best.amt;
  return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%"><div title="${esc(fmt(amt))}" style="width:70%;height:${h}px;background:${top?'var(--bad)':'var(--hh)'};border-radius:4px 4px 0 0"></div><div class="lbl" style="font-size:.62rem;margin-top:3px">${c.day}</div></div>`
 }).join('')}</div>`).join('')}
 <div class="lbl" style="margin-top:2px">${best?`Highest-spend day: ${best.day} ${monthLabel(m)} · ${fmt(best.amt)}`:'No spending logged yet.'}</div>
 </div>`}
function recView(){const d=S.d;return months().map(m=>{const a=agg(m),pin=passive(m),tinc=d.take+pin,bal=tinc-a.tot,open=!!S.recOpen[m];
 return`<div class="card"><div class="bk"><b>${monthLabel(m)}</b><button class="chip" style="border:0" data-a="gomonth" data-m="${m}">View transactions</button></div>
 <div class="grid" style="margin:10px 0 4px"><div><div class="lbl">Net outflow</div><b>${fmt(a.tot)}</b></div><div><div class="lbl">Balance</div><b class="${bal<0?'neg':'pos'}">${fmt(bal)}</b></div><div><div class="lbl">Saved</div><b class="pos">${fmt(a.inv+a.emg)}</b></div><div><div class="lbl">Income</div><b>${fmt(tinc)}</b></div></div>
 ${pin>0?`<div class="lbl" style="margin-bottom:6px">Includes passive income of ${fmt(pin)}</div>`:''}
 ${Object.keys(B).map(k=>`<div class="bk" style="margin-top:6px"><span><span class="dot" style="display:inline-block;background:${B[k].c};margin-right:6px"></span>${B[k].n}</span><span class="${a[k]>budget(k)+0.005?'neg':''}">${fmt(a[k])} / ${fmt(budget(k))}</span></div>`).join('')}
 <button class="btn w" style="margin-top:10px" data-a="toggledetail" data-m="${m}">${open?'Hide daily breakdown ▴':'View daily breakdown ▾'}</button></div>
 ${open?dailyBreakdown(m):''}`}).join('')}
function altot(){let s=0;document.querySelectorAll('[data-al]').forEach(i=>s+=num(i.value));s=Math.round(s*1000)/1000;const e=$('#altot'),b=$('#savecfg');if(e){e.textContent=s+'%';e.className=s===100?'pos':'neg'}if(b)b.disabled=s!==100}
function render(){const app=$('#app');
 if(!S.cur){app.innerHTML=loginView();return}
 const T={dash:['Dashboard',dashView],tx:['Transactions',txView],inc:['Income',incView],sav:['Savings',savingsView],rec:['Monthly records',recView],set:['Settings',setView]};
 const nv=[['dash','◉','Home'],['tx','⇅','Spending'],['inc','💰','Income'],['sav','🏦','Savings'],['rec','▤','Records'],['set','⚙','Settings']];
 const headHTML=S.view==='dash'?`<div class="dhead">${LOGO_SM}<b>Cash Track</b></div><span class="chip chip-abs">${esc(S.cur.name)}</span>`:`<h1>${T[S.view][0]}</h1><span class="chip">${esc(S.cur.name)}</span>`;
 app.innerHTML=`<header>${headHTML}</header><main id="main">${T[S.view][1]()}${FOOT}</main><nav>${nv.map(([v,i,l])=>`<button class="${S.view===v?'on':''}" data-a="nav" data-v="${v}"><span>${i}</span>${l}</button>`).join('')}</nav>`;
 fillList();altot()}

/* ---------- forms ---------- */
function txForm(id,pre){const t=id?S.d.tx.find(x=>x.id===id):null;const b=t?t.b:(pre||S.f.b||'per');
 const dr=monthRange();const body=`<label>Amount (${esc(S.d.cur)})</label><input id="f_a" class="amt" inputmode="decimal" value="${t?t.a:''}" placeholder="0.00"><label>Date</label><input type="date" id="f_d" value="${t?t.d:today()}" min="${dr.min}" max="${dr.max}"><label>Bucket</label><select id="f_b">${opts(Object.keys(B).map(k=>[k,B[k].n]),b)}</select>
 <div id="f_kwrap" style="display:none"><label>Type</label><select id="f_k"><option value="add">Add to savings</option><option value="out">Withdraw from savings</option></select></div>
 <label>Category</label><select id="f_c"></select><label>Note (optional)</label><input id="f_n" maxlength="200" value="${t?esc(t.n):''}">
 ${t?'<button class="btn d w" id="f_del" type="button">Delete transaction</button>':''}`;
 openForm(t?'Edit transaction':'Add transaction',body,'Save',()=>{
  const d=$('#f_d').value,a=num($('#f_a').value),bb=$('#f_b').value;if(!d){toast('Pick a date');return false}if(!d.startsWith(monthRange().cm)){toast('Only dates in the current month can be used');return false}if(!(a>0)){toast('Enter an amount above 0');return false}
  const kk=(B[bb].s&&$('#f_k'))?$('#f_k').value:'add';
  const r={id:t?t.id:uid(),d,b:bb,c:$('#f_c').value,a:Math.round(a*100)/100,n:$('#f_n').value.trim(),k:kk};
  if(t)S.d.tx[S.d.tx.findIndex(x=>x.id===t.id)]=r;else S.d.tx.push(r);save();render();toast('Saved')});
 fillCats(t?t.c:null);toggleKind(t?t.k:'add');
 const del=$('#f_del');if(del)del.onclick=async()=>{closeM();if(await confirmM('Delete transaction?','This cannot be undone.','Delete')){S.d.tx=S.d.tx.filter(x=>x.id!==id);save();render();toast('Deleted')}else txForm(id)}}
function fillCats(sel){const b=$('#f_b').value,l=CATS[b].slice();if(sel&&!l.includes(sel))l.push(sel);$('#f_c').innerHTML=opts(l.map(x=>[x,x]),sel||l[0])}
function toggleKind(sel){const b=$('#f_b'),w=$('#f_kwrap');if(!b||!w)return;const show=B[b.value].s;w.style.display=show?'':'none';if(show&&sel)$('#f_k').value=sel}
function incForm(id){const x=id?(S.d.income||[]).find(y=>y.id===id):null;
 const dr=monthRange();const body=`<label>Amount (${esc(S.d.cur)})</label><input id="f_a" class="amt" inputmode="decimal" value="${x?x.a:''}" placeholder="0.00"><label>Date</label><input type="date" id="f_d" value="${x?x.d:today()}" min="${dr.min}" max="${dr.max}"><label>Source</label><select id="f_c">${opts(INC_CATS.map(c=>[c,c]),x?x.c:INC_CATS[0])}</select><label>Note (optional)</label><input id="f_n" maxlength="200" value="${x?esc(x.n):''}">
 ${x?'<button class="btn d w" id="f_del" type="button">Delete entry</button>':''}`;
 openForm(x?'Edit income':'Add passive income',body,'Save',()=>{
  const d=$('#f_d').value,a=num($('#f_a').value);if(!d){toast('Pick a date');return false}if(!d.startsWith(monthRange().cm)){toast('Only dates in the current month can be used');return false}if(!(a>0)){toast('Enter an amount above 0');return false}
  const r={id:x?x.id:uid(),d,c:$('#f_c').value,a:Math.round(a*100)/100,n:$('#f_n').value.trim()};
  if(!S.d.income)S.d.income=[];
  if(x)S.d.income[S.d.income.findIndex(y=>y.id===x.id)]=r;else S.d.income.push(r);save();render();toast('Saved')});
 const del=$('#f_del');if(del)del.onclick=async()=>{closeM();if(await confirmM('Delete income entry?','This cannot be undone.','Delete')){S.d.income=(S.d.income||[]).filter(y=>y.id!==id);save();render();toast('Deleted')}else incForm(id)}}
function incView(){const ms=[['all','All months'],...months().map(m=>[m,monthLabel(m)])];
 let sel=S.f.im||S.month;if(sel!=='all'&&!months().includes(sel))sel=S.month;
 const l=(S.d.income||[]).filter(x=>sel==='all'||x.d.startsWith(sel)).sort((x,y)=>y.d.localeCompare(x.d));
 const tot=l.reduce((s,x)=>s+x.a,0);const d=S.d;
 return`<div class="card"><b>Monthly salary</b><label style="display:block;margin-top:10px">Currency label</label><input id="s_cur" maxlength="6" value="${esc(d.cur)}">
 <label>Gross monthly salary</label><input id="s_gross" inputmode="decimal" value="${d.gross||''}"><label>Take-home monthly salary</label><input id="s_take" inputmode="decimal" value="${d.take||''}"></div>
 <div class="card"><b>Monthly allocation</b><p class="lbl">Percentages must add up to exactly 100%.</p>
 ${Object.keys(B).map(k=>`<label>${B[k].n} (%)</label><input data-al="${k}" inputmode="decimal" value="${d.al[k]}">`).join('')}
 <div class="bk"><span>Total</span><b id="altot"></b></div><button class="btn p w" id="savecfg" data-a="savecfg">Save</button></div>
 <label>Month</label><select id="im">${opts(ms,sel)}</select>
 ${sel!=='all'?`<div class="card"><div class="bk"><span>Salary</span><b>${fmt(d.take)}</b></div><div class="bk" style="margin-top:6px"><span>Passive income</span><b>${fmt(tot)}</b></div><div class="bk" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><span>Total income</span><b class="pos">${fmt(d.take+tot)}</b></div></div>`:''}
 <h2>Passive income</h2>
 <div class="card">${l.length?`<div class="lbl" style="margin-bottom:4px">${l.length} entr${l.length>1?'ies':'y'} · ${fmt(tot)}</div>`+l.map(incRow).join(''):'<div class="empty">No passive income logged for this period.<br>Tap + to add one.</div>'}</div><button class="fab" data-a="addinc" aria-label="Add income">+</button>`}
function setView(){return`<h2>Backup</h2><div class="card"><p class="lbl">Backups are encrypted with this account's master password.</p>
 <button class="btn w" data-a="export">Export encrypted backup</button><button class="btn w" data-a="import">Import backup</button></div>
 <h2>Account</h2><div class="card"><b>${esc(S.cur.name)}</b><button class="btn w" data-a="lock">Lock</button><button class="btn d w" data-a="delacct">Delete this account</button></div>`}
function savingsView(){const months_=months();
 const rows=k=>months_.map(m=>{const v=agg(m)[k];return{m,v}}).filter(r=>r.v!==0);
 const allTot=k=>savingsAllOne(k);
 return Object.keys(B).filter(k=>B[k].s).map(k=>{const rs=rows(k);
 return`<div class="card"><div class="bk"><b>${B[k].n}</b><b class="pos">${fmt(allTot(k))}</b></div><div class="lbl">All-time total</div>
 ${rs.length?'<div style="margin-top:12px">'+rs.map(r=>`<div class="bk" style="margin-top:6px"><span>${monthLabel(r.m)}</span><b class="${r.v<0?'pos':''}">${fmt(r.v)}</b></div>`).join('')+'</div>':'<div class="empty" style="margin-top:10px">No activity yet.</div>'}</div>`}).join('')}
function pwdBody(withName,confirm){const pa=confirm?' inputmode="numeric" pattern="[0-9]*" maxlength="8"':'';return`${withName?'<label>Account name</label><input id="p_n" maxlength="30" autocomplete="off">':''}<label>${confirm?'Create a PIN (4+ digits)':'PIN / password'}</label><input id="p_p" type="password" autocomplete="off"${pa}>${confirm?'<label>Confirm PIN</label><input id="p_c" type="password" autocomplete="off"'+pa+'><p class="lbl">Minimum 4 digits, numbers only. There is no way to recover a forgotten PIN.</p>':''}`}
function newAcct(){openForm('Create account',pwdBody(true,true),'Create',async()=>{
 const n=$('#p_n').value.trim(),p=$('#p_p').value;
 if(!n){toast('Enter a name');return false}if(nameTaken(n)){toast('That name is already used');return false}
 if(!/^\d{4,}$/.test(p)){toast('PIN must be at least 4 digits (numbers only)');return false}if(p!==$('#p_c').value){toast('Passwords do not match');return false}
 await createAccount(n,p,{al:DEF_AL});render();maybeBackupReminder();toast('Account created')})}
function login(id){const u=S.users.find(x=>x.id===id);if(!u)return;
 openForm('Unlock '+u.name,pwdBody(false,false)+'<button class="btn d w" type="button" id="p_forget" style="display:none"></button>','Unlock',async()=>{
  const p=$('#p_p').value;if(!p){toast('Enter your password');return false}
  const rec=LS.get('pcft_v_'+u.id);if(!rec){toast('Vault data missing on this device');return false}
  try{const key=await derive(p,unb64(u.salt),u.it);const data=await unseal(key,rec);S.cur=u;S.key=key;S.d=norm(data);S.view='dash';S.month=mk(new Date());S.f={m:S.month,b:'',q:'',s:'dd'}}
  catch(e){toast('Incorrect master password');return false}
  render();maybeBackupReminder()});$('#p_p').addEventListener('keydown',e=>{if(e.key==='Enter')$('#mok').click()})}
function lock(){S.cur=null;S.key=null;S.d=null;closeM();render()}
function maybeBackupReminder(){const has=S.d.take>0||S.d.tx.length||(S.d.income&&S.d.income.length);if(!has)return;
 const last=LS.get('pcft_lastbk_'+S.cur.id,null);const days=last?(Date.now()-new Date(last).getTime())/86400000:Infinity;
 if(days>=7)setTimeout(()=>{confirmM('Backup reminder',(last?"It's been over a week since your last backup.":"You haven't exported a backup yet.")+' Export an encrypted backup now?','Export now').then(ok=>{if(ok)exportBk()})},450)}
async function verifyPassword(p){try{const key=await derive(p,unb64(S.cur.salt),S.cur.it);const rec=LS.get('pcft_v_'+S.cur.id);if(!rec)return false;await unseal(key,rec);return true}catch(e){return false}}
function requirePassword(action){openForm('Confirm password','<p class="lbl">Re-enter your master password to continue.</p><label>Master password</label><input id="p_p" type="password" autocomplete="off">','Confirm',async()=>{
 const p=$('#p_p').value;if(!p){toast('Enter your password');return false}
 const ok=await verifyPassword(p);if(!ok){toast('Incorrect password');return false}
 closeM();action();return false});$('#p_p').addEventListener('keydown',e=>{if(e.key==='Enter')$('#mok').click()})}
async function exportBk(){await save();const u=S.cur,v=LS.get('pcft_v_'+u.id);if(!v){toast('Nothing to export');return}
 const o={format:'PCFT_BACKUP_V2',exported:new Date().toISOString(),name:u.name,kdf:'PBKDF2-SHA256',it:u.it,salt:u.salt,alg:'AES-GCM-256',iv:v.iv,ct:v.ct};
 LS.set('pcft_lastbk_'+u.id,new Date().toISOString());
 const fn='PCFT_'+u.name.replace(/[^\w-]+/g,'_')+'_'+today()+'.json';if(window.AndroidBridge){AndroidBridge.save(fn,JSON.stringify(o));return}const url=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Backup exported')}
function importFlow(text){let b;try{b=JSON.parse(text)}catch(e){}
 if(!b||b.format!=='PCFT_BACKUP_V2'||!b.salt||!b.iv||!b.ct||!(b.it>=1000&&b.it<=5e6)){toast('Not a valid PCFT_BACKUP_V2 file');return}
 const inS=!!S.cur;
 openForm('Restore backup',(inS?'<p class="lbl" style="color:var(--bad)">This replaces all data in the current vault.</p>':'<label>Account name</label><input id="p_n" maxlength="30" value="'+esc(b.name||'')+'">')+'<label>Backup master password</label><input id="p_p" type="password" autocomplete="off">','Restore',async()=>{
  const p=$('#p_p').value,n=inS?'':$('#p_n').value.trim();if(!p){toast('Enter the password');return false}
  if(!inS){if(!n){toast('Enter a name');return false}if(nameTaken(n)){toast('That name is already used');return false}}
  let data;try{data=norm(await unseal(await derive(p,unb64(b.salt),b.it),b))}catch(e){toast('Wrong password or corrupted file');return false}
  if(inS){S.d=data;await save()}else await createAccount(n,p,data);
  render();toast('Backup restored')})}

/* ---------- events ---------- */
const A={
 nav:d=>{S.view=d.v;render();const m=$('#main');if(m)m.scrollTop=0},
 login:d=>login(d.id),newacct:newAcct,lock,
 restore:()=>{$('#file').click()},import:()=>{$('#file').click()},
 addtx:d=>txForm(null,d.b),mshift:d=>{const n=Number(d.n),p=S.month.split('-').map(Number),dt=new Date(p[0],p[1]-1+n,1),nm=mk(dt);if(n>0&&nm>monthRange().cm){toast('Future months are not available yet');return}S.month=nm;render()},
 edittx:d=>requirePassword(()=>txForm(d.id)),export:exportBk,
 addinc:()=>incForm(),editinc:d=>requirePassword(()=>incForm(d.id)),
 gomonth:d=>{S.f.m=d.m;S.view='tx';render()},
 toggledetail:d=>{S.recOpen[d.m]=!S.recOpen[d.m];render()},
 savecfg:()=>{const run=async()=>{const cur=$('#s_cur').value.trim()||'Rs',g=num($('#s_gross').value),t=num($('#s_take').value);
  if(g>0&&t>g){toast('Take-home cannot exceed gross');return}
  const al={};let s=0;document.querySelectorAll('[data-al]').forEach(i=>{al[i.dataset.al]=Math.max(0,num(i.value));s+=al[i.dataset.al]});
  if(Math.round(s*1000)/1000!==100){toast('Allocation must total 100%');return}
  Object.assign(S.d,{cur,gross:g,take:t,al});await save();render();toast('Settings saved')};
  if(S.d.take>0){requirePassword(run)}else{run()}},
 delacct:async()=>{if(await confirmM('Delete account?','All data for "'+S.cur.name+'" will be erased from this device. Export a backup first if you need it.','Delete')){const id=S.cur.id;try{localStorage.removeItem('pcft_v_'+id)}catch(e){}S.users=S.users.filter(u=>u.id!==id);LS.set('pcft_users',S.users);lock();toast('Account deleted')}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset,el)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='mo'){S.month=t.value||S.month;render()}
 else if(t.id==='f_b'){fillCats();toggleKind()}
 else if(t.id==='im'){S.f.im=t.value;render()}
 else if(t.dataset.f){S.f[t.dataset.f]=t.value;fillList()}
 else if(t.id==='file'&&t.files[0]){const r=new FileReader();r.onload=()=>importFlow(String(r.result));r.onerror=()=>toast('Could not read file');r.readAsText(t.files[0]);t.value=''}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f==='q'){S.f.q=t.value;fillList()}else if(t.dataset.al!==undefined)altot()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)S.hid=Date.now();else if(S.cur&&S.hid&&Date.now()-S.hid>300000){lock();toast('Locked after inactivity')}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&$('#mc'))$('#mc').click()});
S.users=LS.get('pcft_users',[]);if(!Array.isArray(S.users))S.users=[];
render();
</script>
</body>
</html>
